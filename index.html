<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pediatric & Neonatal ECMO Simulation Engine (QWS Workstation)</title>
  <!-- Anti-cache headers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 Production UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* Custom Scrollbar for Console & Telemetry Logs */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-white">
  <div id="root"></div>

  <!-- ECMO-Sim Core Modules -->
  <script src="./src/skillPrompt.js?v=2026.10.16.9"></script>
  <script src="./src/scenarios.js?v=2026.10.16.9"></script>
  <script src="./src/physiologyEngine.js?v=2026.10.16.9"></script>
  <script src="./src/physiologyBriefing.js?v=2026.10.16.9"></script>
  <script src="./src/multiAgentEngine.js?v=2026.10.16.9"></script>
  <script src="./src/specialistAgent.js?v=2026.10.16.9"></script>

  <script src="./src/components/TelemetryMonitor.js?v=2026.10.16.9"></script>
  <script src="./src/components/QuantumConsole.js?v=2026.10.16.9"></script>
  <script src="./src/components/ClinicalWorkstation.js?v=2026.10.16.9"></script>
  <script src="./src/components/ScenarioLauncherModal.js?v=2026.10.16.9"></script>
  <script src="./src/App.js?v=2026.10.16.9"></script>

  <!-- Mount Application -->
  <script>
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(React.createElement(window.EcmoSimApp));
  </script>

</html>
